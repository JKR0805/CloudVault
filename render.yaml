services:
  - type: web
    name: cloudvault-backend
    env: docker
    region: oregon # or your preferred region
    plan: free # or standard, pro, etc.
    rootDir: backend # This tells Render where to find the Dockerfile
    # Render automatically uses the Dockerfile in rootDir when env is set to docker
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: user-files
